[workspace]
members = [
    "crates/core",
    "crates/pipeline",
    "crates/plugins",
    "crates/server",
    "crates/config",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
async-trait = "0.1"
bytes = "1.0"
uuid = { version = "1", features = ["v4"] }
